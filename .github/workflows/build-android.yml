name: Build Android

# Started by hand or by a version tag: a build takes a large image and many minutes,
# so it does not run on every push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name shown in the game
        default: "0.0.1"
      screenshots:
        description: Run the game in the editor and attach screenshots to the release
        type: boolean
        default: true
      bundle:
        description: Build an App Bundle (.aab) for Google Play instead of an APK
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: build-android
  cancel-in-progress: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  EXTENSION: ${{ github.event.inputs.bundle == 'true' && 'aab' || 'apk' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Free runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Docker Hub limits anonymous pulls per runner address, and runners share addresses.
      # When it refuses, the same image is pulled through Google's public mirror of Docker Hub.
      - name: Pull the Unity image
        id: image
        run: |
          TAG=ubuntu-6000.3.26f1-android-3
          for candidate in "unityci/editor:$TAG" "mirror.gcr.io/unityci/editor:$TAG"; do
            for attempt in 1 2; do
              if docker pull --quiet "$candidate"; then
                echo "name=$candidate" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 15
            done
            echo "$candidate could not be pulled from this runner"
          done
          echo "::error::No registry would serve the Unity image. Re-run the job to get another runner."
          exit 1

      - uses: actions/checkout@v4

      - name: Check .meta files
        run: python3 tools/gen_meta.py --check

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_number }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-

      - name: Write signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret, the APK will have a debug signature"
            exit 0
          fi
          mkdir -p ci/signing
          echo "$KEYSTORE_BASE64" | base64 -d > ci/signing/skyforge.keystore
          printf '%s\n%s\n%s\n' "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > ci/signing/signing.txt

      - name: Build APK
        id: unity
        uses: game-ci/unity-builder@v6
        # The builder reports a failure when handing the Personal seat back ("Serial number
        # unavailable for ULF return") even though the build itself succeeded, so the result
        # is judged by the next step instead.
        continue-on-error: true
        # Personal licence: the builder signs in with the account. A .ulf file from another
        # machine is rejected by Unity, so UNITY_LICENSE is deliberately not passed.
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          customImage: ${{ steps.image.outputs.name }}
          buildName: Skyforge
          buildMethod: Skyforge.EditorTools.BuildScript.BuildAndroid
          versioning: None
          allowDirtyBuild: true
          # The build method plays the game for screenshots, so the editor needs graphics
          # (software rendering under xvfb) and must not be told to quit on its own.
          enableGpu: true
          manualExit: true
          customParameters: >-
            -sfVersion ${{ env.VERSION }} -sfVersionCode ${{ github.run_number }}
            ${{ github.event.inputs.screenshots != 'false' && '-sfScreenshots' || '' }}
            ${{ github.event.inputs.bundle == 'true' && '-sfBundle' || '' }}

      - name: Check that the build exists
        run: |
          ls -lh "build/Android/Skyforge.$EXTENSION"
          test -s "build/Android/Skyforge.$EXTENSION"

      - name: Remove signing files
        if: always()
        run: sudo rm -rf ci/signing

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="skyforge-${VERSION}-${{ github.run_number }}.${EXTENSION}"
          sudo cp "build/Android/Skyforge.$EXTENSION" "$APK"
          ls -lh "$APK"
          FILES=("$APK")
          if ls build/Screenshots/*.png >/dev/null 2>&1; then
            (cd build/Screenshots && sudo zip -q -r ../../screenshots.zip .)
            FILES+=(screenshots.zip)
          fi
          gh release create "dev-${{ github.run_number }}" "${FILES[@]}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Skyforge ${VERSION} (build ${{ github.run_number }})" \
            --notes "Development build from ${GITHUB_SHA::7}."
          # Keep the five newest development builds.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("dev-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
