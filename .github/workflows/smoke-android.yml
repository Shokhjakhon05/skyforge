name: Smoke test on an emulator

# Nobody who builds this game can run it, and the owner's phone is not always at hand. This
# installs a built APK on an Android emulator, starts it, presses its way into a contract, fires
# once, and keeps the screen and the log of each step: proof that the build starts and plays.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of the build to test, e.g. dev-46
        required: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke
          gh release download "${{ github.event.inputs.tag }}" --pattern '*.apk' --dir .
          ls -lh *.apk

      - name: Let the emulator use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_3
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke.sh

      - name: Keep what was seen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.event.inputs.tag }}
          path: smoke

      - name: Attach it to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd smoke && zip -q -r ../smoke.zip .) || true
          if [ -s smoke.zip ]; then gh release upload "${{ github.event.inputs.tag }}" smoke.zip --clobber; fi
